{% extends "base.html" %}

{% block content %}

<!-- 🔔 MENSAGENS (FLASH UX) -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}
<div class="alert"
     style="background:#1f2937; border:1px solid #374151; color:#fff; border-radius:10px;">
    {{ msg }}
</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<!-- 🔙 BOTÃO DE VOLTAR -->
<div class="mb-4">
    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Voltar para Reservas
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card p-4">
            <div class="mb-4">
                <h5 class="page-title mb-1">🔐 Alterar Senha</h5>
                <p class="text-muted mb-0">Atualize sua senha de forma segura.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Senha Atual</label>
                    <input type="password" class="form-control" name="current_password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Nova Senha</label>
                    <input type="password" class="form-control" name="new_password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Confirmar Nova Senha</label>
                    <input type="password" class="form-control" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Alterar Senha</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
