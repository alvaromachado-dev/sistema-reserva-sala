{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">

        <div class="card p-4">
            <h4 class="mb-3">🔐 Login</h4>

            <form method="POST">
                <input class="form-control mb-2" name="username" placeholder="Usuário">
                <input class="form-control mb-3" type="password" name="password" placeholder="Senha">
                <button class="btn btn-primary w-100">Entrar</button>
            </form>

            <hr>

            <h6>Criar conta</h6>

            <form action="/register" method="POST">
                <input class="form-control mb-2" name="username" placeholder="Usuário">
                <input class="form-control mb-2" type="password" name="password" placeholder="Senha">
                <button class="btn btn-secondary w-100">Registrar</button>
            </form>
        </div>

    </div>
</div>

{% endblock %}
