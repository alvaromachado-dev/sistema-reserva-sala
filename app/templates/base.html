<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sala de Reunião</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🌌 Fundo geral */
        body {
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 20%),
                        radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.14), transparent 18%),
                        linear-gradient(180deg, #020617 0%, #09121f 45%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.08), transparent 15%),
                        radial-gradient(circle at 80% 10%, rgba(239, 68, 68, 0.08), transparent 14%);
            pointer-events: none;
        }

        html {
            scroll-behavior: smooth;
        }

        a {
            color: #bfdbfe;
            text-decoration: none;
        }

        a:hover {
            color: #93c5fd;
            text-decoration: none;
        }

        h1, h2, h3, h4, h5, h6,
        p, span, label, a, div {
            color: #f8fafc;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.12);
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 50px rgba(7, 12, 22, 0.28);
        }

        .navbar-brand {
            font-size: 1.25rem;
            letter-spacing: 0.03em;
            color: #e2e8f0;
        }

        .container {
            max-width: 1140px;
            padding-top: 8px;
            padding-bottom: 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(7, 12, 22, 0.22);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: card-appear 0.55s ease-out forwards;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 24px 72px rgba(7, 12, 22, 0.30);
        }

        .form-control,
        .form-select {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #f8fafc;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.5);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18);
        }

        .btn {
            border-radius: 999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(59, 130, 246, 0.18);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .btn-outline-light {
            color: #e2e8f0;
            border-color: rgba(226, 232, 240, 0.35);
        }

        .btn-outline-light:hover {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.16);
            border-color: rgba(59, 130, 246, 0.45);
        }

        .badge {
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            border-radius: 999px;
            padding: 0.45em 0.7em;
            background: rgba(148, 163, 184, 0.12);
            color: #f8fafc;
            backdrop-filter: blur(16px);
        }

        .badge.bg-primary {
            background: rgba(59, 130, 246, 0.18);
            color: #bfdbfe;
        }

        .badge.bg-info {
            background: rgba(96, 165, 250, 0.18);
            color: #e0f2fe;
        }

        .badge.bg-danger {
            background: rgba(239, 68, 68, 0.18);
            color: #fee2e2;
        }

        .text-muted {
            color: #cbd5e1 !important;
            opacity: 0.82;
        }

        .alert {
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            border-radius: 14px;
            box-shadow: 0 18px 42px rgba(7, 12, 22, 0.20);
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .modal-header, .modal-footer {
            border-color: rgba(148, 163, 184, 0.14);
        }

        .form-check-input:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .form-check-label {
            color: #e2e8f0;
        }

        .logo {
            height: 44px;
            margin-right: 12px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3));
        }

        .page-title {
            color: #e2e8f0;
            text-shadow: 0 2px 12px rgba(15, 23, 42, 0.35);
        }

        @keyframes card-appear {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- 🧭 NAVBAR -->
    <nav class="navbar px-4 py-3 mb-4 d-flex align-items-center justify-content-between">

        <div class="d-flex align-items-center">
            <img src="{{ url_for('static', filename='Logo_GD.png') }}"
                 class="logo"
                 alt="Logo">

            <span class="navbar-brand mb-0 h1">
                📅 Sala de Reunião
            </span>
        </div>

        <div>
            {% if current_user.is_authenticated %}
                <a href="/change-password" class="btn btn-outline-warning me-2">🔐 Alterar Senha</a>
                {% if current_user.is_admin %}
                    <a href="/users" class="btn btn-outline-light me-2">👤 Gerenciar Usuários</a>
                {% endif %}
                <a href="/logout" class="btn btn-outline-light">🚪 Sair</a>
            {% endif %}
        </div>

    </nav>

    <!-- 📦 CONTEÚDO -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
