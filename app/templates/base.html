<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sala de Reunião</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🌌 Fundo geral */
        body {
            background: #0f172a;
            color: #ffffff;
        }

        /* 🧠 Força texto branco globalmente */
        h1, h2, h3, h4, h5, h6,
        p, span, label, a, div {
            color: #ffffff;
        }

        /* 🧭 Navbar */
        .navbar {
            background: #111827;
        }

        /* 🪪 Cards */
        .card {
            background: #1f2937;
            border: none;
            border-radius: 12px;
        }

        /* ✍️ Inputs */
        .form-control {
            background: #111827;
            border: 1px solid #374151;
            color: #ffffff;
        }

            .form-control::placeholder {
                color: #9ca3af;
            }

            .form-control:focus {
                background: #111827;
                color: #ffffff;
                border-color: #3b82f6;
                box-shadow: none;
            }

        /* 🔵 Botões */
        .btn-primary {
            background: #3b82f6;
            border: none;
        }

        .btn-danger {
            background: #ef4444;
            border: none;
        }

        /* 🏷️ Badges */
        .badge {
            font-size: 0.85rem;
        }

        /* 🖼️ Logo */
        .logo {
            height: 40px;
            margin-right: 10px;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
        }

        /* 🔥 FIX PRINCIPAL: textos "muted" agora visíveis no dark mode */
        .text-muted {
            color: #ffffff !important;
            opacity: 0.75;
        }

        /* 🧼 pequenas melhorias de legibilidade */
        .small {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <!-- 🧭 NAVBAR -->
    <nav class="navbar px-4 py-3 mb-4 d-flex align-items-center">

        <img src="{{ url_for('static', filename='Logo_GD.png') }}"
             class="logo"
             alt="Logo">

        <span class="navbar-brand mb-0 h1">
            📅 Sala de Reunião
        </span>

    </nav>

    <!-- 📦 CONTEÚDO -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
